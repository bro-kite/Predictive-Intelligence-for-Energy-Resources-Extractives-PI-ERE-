[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ere"
version = "0.1.0"
description = "Predictive Intelligence for Energy, Resources & Extractives"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PI-ERE Team", email = "pi-ere-support@example.com"}
]
keywords = ["predictive-intelligence", "risk-forecasting", "extractives", "time-series", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",

    # Time series & ML
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.5",
    "tslearn>=0.6.0",

    # Transformers & embeddings
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "chronos-forecasting>=1.0.0",  # If available via pip

    # Vector database & similarity search
    "qdrant-client>=1.7.0",
    "faiss-cpu>=1.7.4",

    # Geospatial
    "geopandas>=0.14.0",
    "shapely>=2.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",

    # Data sources & APIs
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas-datareader>=0.10.0",
    "wbgapi>=1.0.12",  # World Bank API

    # Configuration & utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",

    # Explainability
    "shap>=0.44.0",
    "lime>=0.2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "flake8>=6.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
]

gpu = [
    "faiss-gpu>=1.7.4",
    "torch>=2.0.0",  # With CUDA support
]

all = [
    "pi-ere[dev,gpu]",
]

[project.urls]
Homepage = "https://github.com/your-org/pi-ere"
Documentation = "https://github.com/your-org/pi-ere/blob/main/README.md"
Repository = "https://github.com/your-org/pi-ere"
Issues = "https://github.com/your-org/pi-ere/issues"

[project.scripts]
pi-ere = "pi_ere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "prophet.*",
    "tslearn.*",
    "qdrant_client.*",
    "geopandas.*",
    "shapely.*",
    "wbgapi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=pi_ere",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
